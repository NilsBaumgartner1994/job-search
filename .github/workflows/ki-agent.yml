# Lässt den KI-Agenten (Gemini) in GitHub Actions laufen:
# - übernimmt zuerst deine im Browser (GitHub-Pages-Seite) gemachten Änderungen
# - triagiert dann bis zu <limit> unbearbeitete Jobs, auf Wunsch mehrere
#   Angebote je Anfrage (Sammel-Triage, siehe <buendel> / AGENT_BATCH_SIZE)
# - committet Board, Chat-Verläufe und die Pages-Daten (docs/) zurück ins Repo
#
# Voraussetzung: Repo-Secret GEMINI_API_KEY
# (Settings → Secrets and variables → Actions → New repository secret;
#  Schlüssel von https://aistudio.google.com/apikey)
name: KI-Agent

on:
  workflow_dispatch:
    inputs:
      aenderungen:
        description: 'Änderungen aus dem Browser (JSON vom Button "Änderungen kopieren" der Pages-Seite) — leer lassen, wenn keine'
        required: false
        default: ""
      limit:
        description: "Max. Anzahl neu zu triagierender Jobs in diesem Lauf (0 = unbeschränkt; Gratis-Kontingent hat ein Tageslimit)"
        required: false
        default: "200"
      zeitlimit:
        description: "Zeitlimit in Minuten — danach hört der Lauf sauber auf und committet das bis dahin Geschaffte (0 = kein Zeitlimit)"
        required: false
        default: "30"
      buendel:
        description: "Angebote je Gemini-Anfrage: 1 = einzeln, 2/3/5/10/20 = feste Bündel (mehr Angebote pro Tag, da das Tageslimit Anfragen zählt), dynamisch = so viele wie in eine Anfrage passen, standard = Repo-Variable AGENT_BATCH_SIZE bzw. 1"
        required: false
        type: choice
        default: "standard"
        options:
          - standard
          - dynamisch
          - "1"
          - "2"
          - "3"
          - "5"
          - "10"
          - "20"

permissions:
  contents: write

# nie zwei Läufe parallel — beide würden data/agent/ committen
concurrency:
  group: ki-agent
  cancel-in-progress: false

jobs:
  agent:
    runs-on: ubuntu-latest
    # Obergrenze des Runners: GitHub kappt gehostete Runner ohnehin bei 6h.
    # Die eigentliche Notbremse (Zeitlimit + Puffer) setzt der timeout-Befehl
    # im Agent-Schritt durch — Actions-Ausdrücke können nicht rechnen.
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn

      - name: Abhängigkeiten installieren
        run: yarn install --frozen-lockfile
        env:
          # Playwright wird nur vom Interamt-Crawler gebraucht, nicht vom Agenten
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"

      - name: KI-Agent ausführen
        # Notbremse: Zeitlimit + 20 Minuten Puffer, falls der Agent hängt;
        # bei 0 ist timeout deaktiviert und es bremst nur das 6h-Joblimit.
        # Der Commit-Schritt (if: always()) sichert das bis dahin Geschaffte.
        run: |
          timeout --kill-after=60s "$(( MINUTEN > 0 ? (MINUTEN + 20) * 60 : 0 ))s" yarn agent --limit="$LIMIT" --minuten="$MINUTEN"
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          AENDERUNGEN: ${{ inputs.aenderungen }}
          LIMIT: ${{ inputs.limit || '200' }}
          MINUTEN: ${{ inputs.zeitlimit || '30' }}
          # Optionale Repo-Variablen (Settings → Secrets and variables →
          # Actions → Variables) — z.B. für ein bezahltes Gemini-Kontingent:
          # GEMINI_MODEL (Default gemini-flash-latest) und AGENT_DELAY_MS
          # (Pause zwischen Anfragen; Default 7000, bezahlt reicht z.B. 500)
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          AGENT_DELAY_MS: ${{ vars.AGENT_DELAY_MS }}
          # Angebote je Anfrage (Default 1, "dynamisch" = auffüllen) — das
          # Tageslimit zählt Anfragen, nicht Angebote: 2 je Anfrage = doppelt
          # so viele Angebote pro Tag. "standard" → Repo-Variable bzw. Default;
          # unbekannte Werte fallen im Agenten ebenfalls auf 1 zurück.
          AGENT_BATCH_SIZE: ${{ (inputs.buendel == 'standard' && vars.AGENT_BATCH_SIZE) || inputs.buendel }}

      - name: Ergebnisse committen und pushen
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/agent docs
          if git diff --cached --quiet; then
            echo "Keine Änderungen zu committen."
            exit 0
          fi
          git commit -m "KI-Agent: Board & Pages-Daten aktualisieren"
          # Falls zwischenzeitlich jemand gepusht hat: rebase und erneut versuchen
          for i in 1 2 3; do
            git push && exit 0
            git pull --rebase
          done
          git push
